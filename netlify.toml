# The invite is a plain static page. Netlify saw package.json (left over from
# AI Studio) and ran `vite build`, which rewrote image paths and dropped most
# photos. Instead, copy the page and its photos into dist/ unchanged.
[build]
  command = "node scripts/copy-static.mjs"
  publish = "dist"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
